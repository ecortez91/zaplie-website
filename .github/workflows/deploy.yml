name: Deploy

# Builds the static site and deploys it to Azure Static Web Apps on every push to main.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the Static Web App's deployment token).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-getzaplie
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://getzapl.ie

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: node website/build.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: website/dist
          skip_app_build: true
          skip_api_build: true
